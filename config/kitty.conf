# kitty config — tối giản. Xem `kitty --debug-config` để biết giá trị hiệu lực.
# Nerd Font BẮT BUỘC: config pi-footer dùng "iconMode": "nerd" (icon ở dải PUA).
# Bản "Mono" giữ icon đúng 1 ô, tránh lệch cột statusline.
font_family JetBrainsMono Nerd Font Mono
font_size 12

enable_audio_bell no
# Giữ cửa sổ lại khi còn tiến trình chạy (mặc định kitty) — không tắt để khỏi mất việc.
